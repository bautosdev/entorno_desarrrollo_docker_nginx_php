version: '3.8'

services:
  # Servicio de PHP 8.3
  php:
    image: php:8.3-fpm
    container_name: php_dev
    volumes:
      # Comparte la carpeta 'src' local con la carpeta del contenedor
      - ./src:/var/www/html
    networks:
      - app-network

  # Servicio de Nginx
  nginx:
    image: nginx:alpine
    container_name: nginx_dev
    ports:
      - "8080:80"
    volumes:
      # Comparte el código fuente y el archivo de configuración de Nginx
      - ./src:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
